</head>

        <a class="navbar-brand fw-bold fs-3"
            href="index.html">

            🌿 Bloomify

        </a>

        <button class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
            id="menu">

            <ul class="navbar-nav ms-auto">

                </li>

                <li class="nav-item">

                        href="contact.html">

                        Contact

                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- ==========================
        PAGE TITLE
========================== -->

<section class="py-5 bg-light">

    <div class="container text-center">

        <h1 class="fw-bold text-success">

            🛒 Shopping Cart

        </h1>

        <p class="lead">

            Review your selected plants before checkout.

        </p>

    </div>

</section>

<div class="container py-5">

    <div id="cartContainer">

        <!-- Cart Items will load here -->

    </div>
     <!-- ==========================
            CART SUMMARY
    ========================== -->

    <div class="row mt-5">

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-body">

                    <h4 class="text-success mb-4">

                        Order Summary

                    </h4>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <strong id="subTotal">₹0</strong>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>GST (5%)</span>
                        <strong id="gst">₹0</strong>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Delivery</span>
                        <strong id="delivery">₹50</strong>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between">

                        <h4>Total</h4>

                        <h4 class="text-success" id="finalTotal">

                            ₹0

                        </h4>

                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card shadow">

                <div class="card-body">

                    <h4 class="text-success mb-4">

                        Coupon

                    </h4>

                    <input
                        type="text"
                        id="coupon"
                        class="form-control mb-3"
                        placeholder="Enter Coupon Code">

                    <button
                        class="btn btn-primary w-100 mb-3"
                        onclick="applyCoupon()">

                        Apply Coupon

                    </button>

                    <button
                        class="btn btn-success w-100 mb-3"
                        onclick="checkout()">

                        Proceed To Checkout

                    </button>

                    <button
                        class="btn btn-outline-danger w-100"
                        onclick="clearCart()">

                        Clear Cart

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

            📞 9764446458
        </p>
