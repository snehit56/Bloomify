<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bloomify Admin Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">

<div class="container">

<a class="navbar-brand fw-bold">

🌿 Bloomify Admin

</a>

<a href="index.html" class="btn btn-light">

Back Website
<button
    class="btn btn-danger ms-2"
    onclick="logout()">
    Logout
</button>

</a>

</div>

</nav>

<div class="container py-4">
    <div class="row g-4">

<div class="col-md-3">

<div class="card bg-success text-white shadow">

<div class="card-body text-center">

<h5>Total Products</h5>

<h2 id="totalProducts">0</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-primary text-white shadow">

<div class="card-body text-center">

<h5>Total Orders</h5>

<h2 id="totalOrders">0</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-warning shadow">

<div class="card-body text-center">

<h5>Pending Orders</h5>

<h2 id="pendingOrders">0</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-danger text-white shadow">

<div class="card-body text-center">

<h5>Total Sales</h5>

<h2 id="totalSales">₹0</h2>

</div>

</div>

</div>

</div>
<div class="card shadow mt-5">

<div class="card-header bg-success text-white">

<h4>Add Product</h4>

</div>

<div class="card-body">

<div class="row">

<div class="col-md-6">

<input
type="text"
id="productName"
class="form-control mb-3"
placeholder="Plant Name">

<input
type="number"
id="productPrice"
class="form-control mb-3"
placeholder="Price">

<select
id="productCategory"
class="form-select mb-3">

<option>Indoor Plant</option>

<option>Outdoor Plant</option>

<option>Flowering Plant</option>

<option>Succulent</option>

<option>Pot</option>

</select>

</div>

<div class="col-md-6">

<input
type="file"
id="productImage"
class="form-control mb-3"
accept="image/*">

<img
id="previewImage"
src=""
style="
display:none;
width:180px;
height:180px;
object-fit:cover;
border-radius:10px;
margin-top:10px;">
<textarea
id="productDescription"
rows="5"
class="form-control"
placeholder="Description"></textarea>

</div>

</div>

<button
class="btn btn-success mt-3"
onclick="addProduct()">

Save Product

</button>

</div>

</div>
<div class="card shadow mt-5">

    <div class="card-header bg-success text-white">
        <div class="row mb-3">

    <div class="col-md-6">

        <input
            type="text"
            id="productSearch"
            class="form-control"
            placeholder="🔍 Search Product..."
            onkeyup="loadProducts()">

    </div>

</div>
        <h4>🌿 Product List</h4>
    </div>

    <div class="card-body table-responsive">

        <table class="table table-bordered table-hover align-middle">

            <thead class="table-success">

                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="productTable">

            </tbody>

        </table>

    </div>

</div>
<div class="row mt-5">

    <div class="col-md-6">

        <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="🔍 Search Order..."
            onkeyup="loadOrders()">

    </div>

    <div class="col-md-3">

        <select
            id="statusFilter"
            class="form-select"
            onchange="loadOrders()">

            <option value="">All Status</option>
            <option>Pending</option>
            <option>Confirmed</option>
            <option>Shipped</option>
            <option>Delivered</option>
            <option>Cancelled</option>

        </select>

    </div>

</div>
<div class="card shadow mt-3">

    <div class="card-header bg-primary text-white">

        <h4>📦 Customer Orders</h4>

    </div>

    <div class="card-body table-responsive">

        <table class="table table-bordered table-hover">

            <thead class="table-primary">

                <tr>

                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Mobile</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="ordersTable">

            </tbody>

        </table>

    </div>

</div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">

    <p class="mb-0">

        © 2026 Bloomify Admin Panel

    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="admin.js"></script>
<script type="module" src="auth.js"></script>
</body>

</html>
